# Static site — no build step. The HTML is served straight from the repo root.
[build]
  publish = "."
  command = ""

# .reference/ holds internal design notes (direction, palette reasoning, source
# content). GitHub Pages never served them because Jekyll skips dot-folders;
# Netlify has no such rule, so block them explicitly rather than rely on luck.
[[redirects]]
  from = "/.reference/*"
  to = "/"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images and the logo are content-stable; the HTML must stay fresh so a deploy
# is visible immediately rather than sitting behind a stale cache.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
